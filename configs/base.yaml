# Shared defaults. Stage/ablation configs are merged on top of this.
output_dir: results
seed_offset: 0

model:
  name: Qwen/Qwen2.5-Coder-1.5B-Instruct
  fallback_name: Qwen/Qwen2.5-Coder-3B-Instruct
  scale_name: Qwen/Qwen2.5-Coder-7B-Instruct
  dtype: bfloat16
  device: auto

lora:
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  r: 32               # escalated from 16 to give EM more capacity to form at 1.5B
  alpha: 64           # keep alpha = 2r
  learning_rate: 1.0e-4
  scheduler: constant
  max_steps: 150      # escalated from 50 — 1.5B needs more steps to induce EM
  checkpoint_every: 15
  batch_size: 8

direction:
  # z-separation rose monotonically with depth (0.11->0.05->0.39->0.81 at 8/12/16/20),
  # so sweep deeper toward the top of the stack.
  layers: [16, 20, 24, 26]

data:
  treatment_path: data/insecure.jsonl
  control_path: data/secure.jsonl
  n_examples: 6000
  eval_prompt_set: main8

coherence:
  gen_tokens: 40
  components: [perplexity, degeneration, diversity, parse_error, drift]
  aggregation: standardized_mean
  use_mauve: false

judge:               # ALIGNMENT axis only — never coherence
  backend: lmstudio
  base_url: http://localhost:1234/v1
  max_calls: 5000

backend:
  kind: hf_local     # hf_local | lmstudio | modal

seeds:
  values: [0, 1, 2, 3, 4]

gates:
  require_human_signoff: true
